<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>core-flow</title>
<!-- 「一套内核」流程图：880×380（CSS 像素），按 2 倍出图。上层是四端各自的采集，下层是四端共用的内核。
     平台顺序固定：Android → Windows → iOS → macOS。iOS 只写一个词，不展开。 -->
<script>if (/[?&]theme=dark\b/.test(location.search)) document.documentElement.setAttribute("data-theme", "dark");</script>
<link rel="stylesheet" href="tokens.css">
<style>
  .canvas { position: relative; width: 880px; height: 380px; padding: 24px 28px 0; border-radius: 22px; background: var(--card); border: 1px solid var(--line); overflow: hidden; }
  .row-label { display: flex; align-items: center; gap: 10px; }
  .row-label .aside { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }

  .cap-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
  .cap { height: 84px; padding: 11px 13px; border-radius: 14px; background: var(--bg-tint); border: 1px solid var(--line); }
  .cap-h { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; line-height: 1.3; }
  .cap-d { margin-top: 5px; font-size: 12px; line-height: 1.5; color: var(--ink-2); }

  .wires { display: block; margin: 0 -28px; }

  .core { display: flex; align-items: stretch; gap: 0; margin-top: 12px; padding: 14px; border-radius: 18px; background: var(--blue-soft); border: 1.5px solid color-mix(in srgb, var(--blue) 50%, transparent); }
  .step { flex: 1; padding: 11px 12px 12px; border-radius: 13px; background: var(--card); border: 1px solid var(--blue-line); }
  .step-h { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; line-height: 1.3; }
  .no { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--blue); color: var(--blue-ink); font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .step-d { margin-top: 6px; font-size: 12px; line-height: 1.55; color: var(--ink-2); }
  .step-d b { color: var(--ink); }
  .arr { flex: none; display: grid; place-items: center; width: 26px; color: var(--blue); }
  .send { display: inline-grid; place-items: center; width: 18px; height: 18px; margin-left: auto; border-radius: 50%; background: #3a7afe; color: #fff; outline: 1.5px dashed var(--blue); outline-offset: 2px; }

  .foot { margin-top: 14px; font-size: 13px; line-height: 1.6; color: var(--ink-2); }
  .foot b { color: var(--ink); }
</style>
</head>
<body>
<div class="canvas">
  <p class="row-label"><span class="kicker plain">采集</span><span class="aside">四端各自适配：怎么拿到屏幕上的对话</span></p>
  <div class="cap-row">
    <div class="cap">
      <p class="cap-h"><svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M18.4395 5.5586c-.675 1.1664-1.352 2.3318-2.0274 3.498-.0366-.0155-.0742-.0286-.1113-.043-1.8249-.6957-3.484-.8-4.42-.787-1.8551.0185-3.3544.4643-4.2597.8203-.084-.1494-1.7526-3.021-2.0215-3.4864a1.1451 1.1451 0 0 0-.1406-.1914c-.3312-.364-.9054-.4859-1.379-.203-.475.282-.7136.9361-.3886 1.5019 1.9466 3.3696-.0966-.2158 1.9473 3.3593.0172.031-.4946.2642-1.3926 1.0177C2.8987 12.176.452 14.772 0 18.9902h24c-.119-1.1108-.3686-2.099-.7461-3.0683-.7438-1.9118-1.8435-3.2928-2.7402-4.1836a12.1048 12.1048 0 0 0-2.1309-1.6875c.6594-1.122 1.312-2.2559 1.9649-3.3848.2077-.3615.1886-.7956-.0079-1.1191a1.1001 1.1001 0 0 0-.8515-.5332c-.5225-.0536-.9392.3128-1.0488.5449zm-.0391 8.461c.3944.5926.324 1.3306-.1563 1.6503-.4799.3197-1.188.0985-1.582-.4941-.3944-.5927-.324-1.3307.1563-1.6504.4727-.315 1.1812-.1086 1.582.4941zM7.207 13.5273c.4803.3197.5506 1.0577.1563 1.6504-.394.5926-1.1038.8138-1.584.4941-.48-.3197-.5503-1.0577-.1563-1.6504.4008-.6021 1.1087-.8106 1.584-.4941z"/></svg>Android</p>
      <p class="cap-d">无障碍读屏<br>读不到时本机 OCR</p>
    </div>
    <div class="cap">
      <p class="cap-h"><svg width="14" height="14" viewBox="0 0 24 24"><path fill="currentColor" d="M1 1h10.5v10.5H1zM12.5 1H23v10.5H12.5zM1 12.5h10.5V23H1zM12.5 12.5H23V23H12.5z"/></svg>Windows</p>
      <p class="cap-d">截自己的聊天窗口<br>本机离线 OCR</p>
    </div>
    <div class="cap">
      <p class="cap-h"><svg width="15" height="15" viewBox="0 0 24 24"><path fill="currentColor" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.090 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>iOS</p>
      <p class="cap-d">剪贴板</p>
    </div>
    <div class="cap">
      <p class="cap-h"><svg width="15" height="15" viewBox="0 0 24 24"><path fill="currentColor" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.090 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>macOS</p>
      <p class="cap-d">读窗口里的文字<br>或截窗口后本机 OCR</p>
    </div>
  </div>

  <!-- 四条线汇成一条，落到内核中间 -->
  <svg class="wires" width="880" height="44" viewBox="0 0 880 44" aria-hidden="true">
    <g fill="none" stroke="var(--line-2)" stroke-width="1.6" stroke-linecap="round">
      <path d="M126.25 0v12a6 6 0 0 0 6 6H433a6 6 0 0 1 6 6"/>
      <path d="M334.75 0v12a6 6 0 0 0 6 6H433"/>
      <path d="M543.25 0v12a6 6 0 0 1 -6 6H445"/>
      <path d="M751.75 0v12a6 6 0 0 1 -6 6H445a6 6 0 0 0 -6 6"/>
      <path d="M439 24v12" stroke="var(--blue)"/>
    </g>
    <path d="M433.5 33.5 439 40l5.5-6.5" fill="none" stroke="var(--blue)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <p class="row-label" style="margin-top: 2px"><span class="kicker plain">内核</span><span class="aside">四端共用：判断 → 起草 → 排序 → 填入</span></p>
  <div class="core">
    <div class="step"><p class="step-h"><span class="no">1</span>判断</p><p class="step-d">真实意图、危险等级 0–9、<br>该不该马上回，都带概率</p></div>
    <span class="arr"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M4.5 12h14M13 6.5l5.5 5.5-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <div class="step"><p class="step-h"><span class="no">2</span>起草</p><p class="step-d">生成模型顺着判断<br>写候选回复</p></div>
    <span class="arr"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M4.5 12h14M13 6.5l5.5 5.5-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <div class="step"><p class="step-h"><span class="no">3</span>排序</p><p class="step-d">按合适程度重排，<br>标出概率</p></div>
    <span class="arr"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M4.5 12h14M13 6.5l5.5 5.5-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <div class="step"><p class="step-h"><span class="no">4</span>填入<span class="send"><svg width="10" height="10" viewBox="0 0 24 24"><path fill="currentColor" d="M3.4 20.1 21 12 3.4 3.9l-.1 6.3L15 12 3.3 13.8z"/></svg></span></p><p class="step-d">一键进输入框，<br><b>发送键由你按</b></p></div>
  </div>
</div>
</body>
</html>
